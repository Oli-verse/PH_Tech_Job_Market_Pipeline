version: 2

models:
  - name: stg_jobs
    description: "Cleaned, title-filtered, deduplicated job postings."
    columns:
      - name: id
        description: "Jooble's posting ID — natural key."
        tests:
          - not_null
          - unique
      - name: title
        tests:
          - not_null
      - name: company
        tests:
          - not_null
      - name: fetched_at
        tests:
          - not_null
