version: 2

models:
  - name: dim_company
    columns:
      - name: company_key
        tests:
          - not_null
          - unique

  - name: dim_location
    columns:
      - name: location_key
        tests:
          - not_null
          - unique

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - not_null
          - unique
      - name: date_day
        tests:
          - not_null
          - unique

  - name: dim_skill
    columns:
      - name: skill_key
        tests:
          - not_null
          - unique

  - name: fact_job_postings
    columns:
      - name: job_id
        tests:
          - not_null
          - unique
      - name: company_key
        tests:
          - relationships:
              to: ref('dim_company')
              field: company_key
      - name: location_key
        tests:
          - relationships:
              to: ref('dim_location')
              field: location_key
      - name: date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
